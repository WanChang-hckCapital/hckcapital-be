spring.application.name=hckcapital-be
server.port=8080

# MongoDB - same database as hckcapital web. No fallback default — real credentials belong
# in .env (see spring-dotenv), not committed here. Startup fails clearly if unset.
spring.data.mongodb.uri=${MONGODB_URL}
spring.data.mongodb.database=${MONGODB_DB:test}
spring.data.mongodb.auto-index-creation=false

# JWT — same as MONGODB_URL above, no baked-in secret default.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Google Sign-In (see AuthService.loginWithGoogle) — comma-separated list of every OAuth
# Client ID allowed to have issued the ID token (the old Next.js reference project's own
# "Web application" GOOGLE_CLIENT_ID, plus the RN app's own "iOS"/"Android" client IDs from
# ../../../../.env's own EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID — see hckcapital-mobile-fe's
# config/api.ts). Only client IDs are needed server-side (the verifier's expected
# "audience", not a secret); no client secret is involved since this only ever verifies an
# already-issued ID token, it never exchanges an authorization code itself.
google.client-id=${GOOGLE_CLIENT_ID:}

# Image uploads (card editor's Add Image feature — see ImageController/ImageUploadService).
# Reuses the same bucket/service-account .env fields the old Next.js reference project
# already defines (see that project's app/api/v1/images/route.ts) rather than introducing
# parallel ones
gcs.bucket-name=${NEXT_PUBLIC_PUBLIC_BUCKET_NAME:}
gcs.project-environment=${NEXT_PUBLIC_PROJECT_ENVIRONMENT:}
gcs.service-account-type=${SERVICE_ACCOUNT_TYPE_BUCKET:}
gcs.service-account-project-id=${SERVICE_ACCOUNT_PROJECT_ID_BUCKET:}
gcs.service-account-private-key-id=${SERVICE_ACCOUNT_PRIVATE_KEY_ID_BUCKET:}
gcs.service-account-private-key=${SERVICE_ACCOUNT_PRIVATE_KEY_BUCKET:}
gcs.service-account-client-email=${SERVICE_ACCOUNT_CLIENT_EMAIL_BUCKET:}
gcs.service-account-client-id=${SERVICE_ACCOUNT_CLIENT_ID_BUCKET:}
gcs.service-account-auth-uri=${SERVICE_ACCOUNT_AUTH_URI_BUCKET:}
gcs.service-account-token-uri=${SERVICE_ACCOUNT_TOKEN_URI_BUCKET:}
gcs.service-account-auth-provider-cert-url=${SERVICE_ACCOUNT_AUTH_PROVIDER_X509_CERT_URL_BUCKET:}
gcs.service-account-client-cert-url=${SERVICE_ACCOUNT_CLIENT_X509_CERT_URL_BUCKET:}
gcs.service-account-universe-domain=${SERVICE_ACCOUNT_UNIVERSE_DOMAIN_BUCKET:}
# Above VideoController's own 100MB cap (110MB, not exactly 100MB) so an oversized video
# still reaches that controller's check and gets its clear "File exceeds 100MB limit"
# response, rather than being rejected by Spring's multipart resolver first with a generic
# MaxUploadSizeExceededException.
spring.servlet.multipart.max-file-size=110MB
spring.servlet.multipart.max-request-size=110MB
